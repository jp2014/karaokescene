[build]
  base = ""
  command = "pnpm build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "apps/api/netlify"
  node_bundler = "esbuild"
  included_files = ["apps/api/drizzle/**"]
  external_node_modules = ["@libsql/client", "libsql"]

# SPA fallback (client-side routes). /api/* is claimed by the function first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
