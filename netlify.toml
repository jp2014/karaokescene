# The PWA is a static site. The API runs on Supabase (Edge Function `api`).
# `pnpm release` builds and deploys it; git-triggered builds need the VITE_* variables
# (VITE_API_URL, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, optional VITE_FIREBASE_*) set in Netlify.
[build]
  command = "pnpm build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback (client-side routes).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
